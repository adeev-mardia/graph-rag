[project]
name = "graph-rag"
version = "0.1.0"
description = "A graph-based retrieval-augmented generation system, benchmarked against plain vector retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Adeev Mardia" },
]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
graphrag = "graphrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphrag*"]
